#video settings defaults
underwaterOverlay = false
oldHandLight      = true
oldLighting       = false
vignette          = false
clouds            = off

#quality profiles (Low / Medium / Prime). Changing any option afterwards shows "Custom"
profile.LOW    = !MOTION_BLUR HARDCORE_DARKNESS:1 DYNAMIC_LIGHT_FLICKER:0 WATER_WAVE_STRENGTH:100 REFLECT WATER_REFRACT PRETTY_SUN_MOON HELD_GLOW:100 LIGHTNING_FLASH:100 SKY_DRAMA:1.0 MOON_SIZE:1.3 !BLUR_ENABLED UNDERWATER_BLUR:0 WATER_BLUR:0 GLASS_BLUR:0 !CLOUDS !CLOUD_NORMALS !FANCY_STARS !GALAXIES !WATER_NORMALS !ICE_REFRACT !ICE_NORMALS !PUDDLES !WET_DIRT !GRASS_PATCHES !WAVING_LEAVES !WAVING_VINES !GRASS_AO !LAVA_PATCHES ORE_SHINE:0 HEAT_REFRACTION:0.00 CLOUD_THICKNESS:1.0 RAIN_SUN:50 SNOW_COVER:0 SUNRISE_ANIMATION:100 STORM_WAVES:100 !SHADOWS QUARTZ_SHINE:0
profile.MEDIUM = !MOTION_BLUR HARDCORE_DARKNESS:1 DYNAMIC_LIGHT_FLICKER:0 WATER_WAVE_STRENGTH:100 REFLECT WATER_REFRACT PRETTY_SUN_MOON HELD_GLOW:100 LIGHTNING_FLASH:100 SKY_DRAMA:1.0 MOON_SIZE:1.3 !BLUR_ENABLED BLUR_QUALITY:5 UNDERWATER_BLUR:0 WATER_BLUR:0 GLASS_BLUR:0 CLOUDS CLOUD_NORMALS !FANCY_STARS !GALAXIES !WATER_NORMALS ICE_REFRACT ICE_NORMALS PUDDLES WET_DIRT GRASS_PATCHES !WAVING_LEAVES !WAVING_VINES !GRASS_AO !LAVA_PATCHES ORE_SHINE:100 HEAT_REFRACTION:1.00 CLOUD_THICKNESS:2.0 RAIN_SUN:50 SNOW_COVER:100 SUNRISE_ANIMATION:100 STORM_WAVES:100 !SHADOWS QUARTZ_SHINE:100
profile.PRIME  = MOTION_BLUR MOTION_BLUR_STRENGTH:100 HARDCORE_DARKNESS:1 DYNAMIC_LIGHT_FLICKER:0 WATER_WAVE_STRENGTH:100 REFLECT WATER_REFRACT PRETTY_SUN_MOON HELD_GLOW:100 LIGHTNING_FLASH:100 SKY_DRAMA:1.0 MOON_SIZE:1.3 BLUR_ENABLED BLUR_QUALITY:10 UNDERWATER_BLUR:8 WATER_BLUR:4 GLASS_BLUR:8 CLOUDS CLOUD_NORMALS FANCY_STARS GALAXIES WATER_NORMALS ICE_REFRACT ICE_NORMALS PUDDLES WET_DIRT GRASS_PATCHES WAVING_LEAVES WAVING_VINES GRASS_AO LAVA_PATCHES ORE_SHINE:100 HEAT_REFRACTION:1.00 CLOUD_THICKNESS:2.0 RAIN_SUN:50 SNOW_COVER:100 SUNRISE_ANIMATION:100 STORM_WAVES:100 SHADOWS shadowMapResolution:4096 shadowDistance:128.0 QUARTZ_SHINE:100

#config screen organization
screen            = <profile> <empty> [BLUR] [WATER] [BLOCK] [FOLIAGE] [AMBIENT] [SKY] [MISC] [INTERNAL]
screen.WATER      = WATER_WAVE_STRENGTH STORM_WAVES WATER_REFRACT REFRACT_AMOUNT WATER_NORMALS UNDERWATER_FOG INFINITE_OCEANS CLEAR_WATER BRIGHT_WATER
screen.BLUR       = MOTION_BLUR MOTION_BLUR_STRENGTH BLUR_ENABLED BLUR_QUALITY UNDERWATER_BLUR RAIN_BLUR WATER_BLUR GLASS_BLUR ICE_BLUR DOF_STRENGTH centerDepthHalflife
screen.FOLIAGE    = REMOVE_XZ_OFFSET REMOVE_Y_OFFSET GRASS_PATCHES HUMIDITY_OFFSET WAVING_GRASS GRASS_WIND_SPEED WAVING_LEAVES WAVING_VINES GRASS_AO LEGACY_SUGARCANE
screen.SKY        = PRETTY_SUN_MOON ROUND_SUN SUNRISE_ANIMATION MOON_SIZE RAIN_SUN SKY_DRAMA FANCY_STARS GALAXIES EXCLUSION_RADIUS OVERWORLD_HORIZON_HEIGHT OVERWORLD_SKY_SATURATION_BOOST OVERWORLD_FOG_SATURATION_BOOST CLOUDS CLOUD_THICKNESS LIGHTNING_FLASH CLOUD_DENSITY_AVERAGE CLOUD_DENSITY_VARIANCE OLD_CLOUDS CLOUD_NORMALS <empty> VOID_CLOUDS VOID_CLOUD_HEIGHT <empty> ENDER_NEBULAE ENDER_ARCS ENDER_STARS TF_AURORAS TF_HORIZON_HEIGHT
screen.INTERNAL   = SUN_POSITION_FIX BRIGHT_PORTAL_FIX TF_SKY_FIX CUSTOM_SKY_FIX THRESHOLD_ALPHA SEA_LEVEL NETHER_LAVA_LEVEL
screen.AMBIENT    = SHADOWS shadowMapResolution shadowDistance NETHER_ATMOSPHERE [FOG] [EYE_ADJUST] DOF_STRENGTH HARDCORE_DARKNESS DESATURATE_NIGHT DESATURATE_RAIN DESATURATE_END CROSS_PROCESS VANILLA_LIGHTMAP SHADE_STRENGTH WAVING_RAIN HEAT_REFRACTION
screen.EYE_ADJUST = EYE_ADJUST_OVERWORLD_DARK EYE_ADJUST_OVERWORLD_LIGHT EYE_ADJUST_NETHER_DARK EYE_ADJUST_NETHER_LIGHT EYE_ADJUST_END_DARK EYE_ADJUST_END_LIGHT EYE_ADJUST_TF_DARK EYE_ADJUST_TF_LIGHT
screen.FOG        = FOG_ENABLED_OVERWORLD FOG_DENSITY_MULTIPLIER_OVERWORLD FOG_ENABLED_NETHER FOG_DENSITY_MULTIPLIER_NETHER FOG_ENABLED_END FOG_DISTANCE_MULTIPLIER_END FOG_ENABLED_TF FOG_DISTANCE_MULTIPLIER_TF UNDERWATER_FOG FOG_HEIGHT_MULTIPLIER_OVERWORLD
screen.BLOCK      = [END_PORTAL_DIM_SELECT] [WATER] ICE_REFRACT ICE_NORMALS ALT_GLASS REFLECT JUMPING_DRAGON_EGGS FANCY_BEACONS END_PORTAL_GLOW ORE_SHINE QUARTZ_SHINE HELD_GLOW PUDDLES SNOW_COVER LAVA_PATCHES LAVA_WAVE_STRENGTH SOUL_LAVA SOUL_LAVA_AMOUNT WET_DIRT LEGACY_SUGARCANE
screen.MISC       = *

screen.END_PORTAL_DIM_SELECT    = [END_PORTAL_DIM_OVERWORLD] [END_PORTAL_DIM_NETHER] [END_PORTAL_DIM_END] [END_PORTAL_DIM_TF]
screen.END_PORTAL_DIM_OVERWORLD = END_PORTAL_EFFECTS_OVERWORLD END_PORTAL_BACKGROUND_OVERWORLD END_PORTAL_FOREGROUND_OVERWORLD END_PORTAL_CLOUDS_OVERWORLD
screen.END_PORTAL_DIM_NETHER    = END_PORTAL_EFFECTS_NETHER END_PORTAL_BACKGROUND_NETHER END_PORTAL_FOREGROUND_NETHER END_PORTAL_CLOUDS_NETHER
screen.END_PORTAL_DIM_END       = END_PORTAL_EFFECTS_END END_PORTAL_BACKGROUND_END END_PORTAL_FOREGROUND_END END_PORTAL_CLOUDS_END
screen.END_PORTAL_DIM_TF        = END_PORTAL_EFFECTS_TF END_PORTAL_BACKGROUND_TF END_PORTAL_FOREGROUND_TF END_PORTAL_CLOUDS_TF

sliders = MOTION_BLUR_STRENGTH END_PORTAL_GLOW SOUL_LAVA_AMOUNT NETHER_ATMOSPHERE \
BLUR_QUALITY WATER_BLUR UNDERWATER_BLUR RAIN_BLUR GLASS_BLUR ICE_BLUR DOF_STRENGTH centerDepthHalflife \
GRASS_WIND_SPEED GLINT_STRENGTH QUARTZ_SHINE RAIN_SUN SNOW_COVER SUNRISE_ANIMATION STORM_WAVES CLOUD_THICKNESS LIGHTNING_FLASH ORE_SHINE HELD_GLOW MOON_SIZE SKY_DRAMA CLOUD_DENSITY_AVERAGE CLOUD_DENSITY_VARIANCE VOID_CLOUD_HEIGHT \
FOG_DENSITY_MULTIPLIER_OVERWORLD FOG_DENSITY_MULTIPLIER_NETHER FOG_DISTANCE_MULTIPLIER_END FOG_DISTANCE_MULTIPLIER_TF FOG_HEIGHT_MULTIPLIER_OVERWORLD \
OVERWORLD_SKY_SATURATION_BOOST OVERWORLD_FOG_SATURATION_BOOST OVERWORLD_HORIZON_HEIGHT TF_HORIZON_HEIGHT \
DESATURATE_NIGHT DESATURATE_RAIN DESATURATE_END \
DYNAMIC_LIGHT_FLICKER DYNAMIC_LIGHT_VIGNETTE \
EYE_ADJUST_OVERWORLD_DARK EYE_ADJUST_OVERWORLD_LIGHT EYE_ADJUST_NETHER_DARK EYE_ADJUST_NETHER_LIGHT EYE_ADJUST_END_DARK EYE_ADJUST_END_LIGHT EYE_ADJUST_TF_DARK EYE_ADJUST_TF_LIGHT \
SEA_LEVEL WATER_WAVE_STRENGTH REFRACT_AMOUNT \
NETHER_LAVA_LEVEL LAVA_WAVE_STRENGTH \
HEAT_REFRACTION HUMIDITY_OFFSET EXCLUSION_RADIUS THRESHOLD_ALPHA SHADE_STRENGTH sunPathRotation

#custom textures
texture.gbuffers.gaux1  = /textures/overworld.png
texture.gbuffers.gaux2  = /textures/end_island.png
texture.composite.gaux4 = minecraft:dynamic/lightmap_1

#ensure that blur does not have a different horizontal vs. vertical radius when using a non-standard rendering quality
scale.world0/composite2  = 1.0
program.world0/composite2.enabled = BLUR_ENABLED
#NoName: the shadow pass only runs with shadows on (Máximo)
program.world0/shadow.enabled = SHADOWS
#NoName: end portal mask must be written as-is (alpha 0 would otherwise be blended away)
blend.gbuffers_block.colortex8 = off
#NoName: entities erase water data behind them where they are solid (see gbuffers_entities.fsh). alpha goes to 0, not up
blend.gbuffers_entities.colortex3 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities.colortex8 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE_MINUS_SRC_ALPHA
scale.world1/composite2  = 1.0
scale.world-1/composite2 = 1.0
scale.world7/composite2  = 1.0

#uniforms
uniform.float.adjustedTime = abs((((worldTime / 1000.0) + 6.0) % 24.0) - 12.0)
uniform.float.day          = clamp(6.7 - adjustedTime, 0.0, 1.0)
uniform.float.night        = clamp(adjustedTime - 6.7, 0.0, 1.0)
uniform.float.sunset       = (1.0 - day) - night
uniform.float.phase        = abs((moonPhase * 0.25) - 1.0)

uniform.float.pixelSizeX   = 1.0 / viewWidth
uniform.float.pixelSizeY   = 1.0 / viewHeight

uniform.float.fov = atan(1.0 / gbufferProjection.0.0)

uniform.vec3.actualCameraPosition = vec3(cameraPosition.x + gbufferModelViewInverse.3.0, cameraPosition.y + gbufferModelViewInverse.3.1, cameraPosition.z + gbufferModelViewInverse.3.2)

uniform.float.inSoulSandValley = smooth(if(biome == BIOME_SOUL_SAND_VALLEY, 1.0, 0.0), 10, 10)
uniform.float.inBasaltDeltas = smooth(if(biome == BIOME_BASALT_DELTAS, 1.0, 0.0), 10, 10)
#NoName: rain cloud cover. grows in ~10s when rain starts, thins out over ~1 min when it stops (wetness lingered for minutes)
uniform.float.cloudWeather = smooth(rainStrength, 5, 15)
#NoName: snow cover. only while it snows where you are (snowy biome or high enough). builds up over ~40 s, melts over ~2 min
uniform.float.snowCover = smooth(if(biome_precipitation == PPT_SNOW, rainStrength, 0.0), 40, 120)
#NoName: snowing right now (used to turn rain puddles off in the snow)
uniform.float.snowing = smooth(if(biome_precipitation == PPT_SNOW, 1.0, 0.0), 5, 5)
#NoName: sun through the clouds in plain rain (not in thunderstorms)
uniform.float.rainSun = rainStrength * (1.0 - thunderStrength)
#NoName: biome ambience: greenish swamps, warm hazy deserts/badlands, cold blue air where it's cold. fades over ~10 s
uniform.float.swampAir = smooth(if(biome_category == CAT_SWAMP, 1.0, 0.0), 10, 10)
uniform.float.desertAir = smooth(if(biome_category == CAT_DESERT || biome_category == CAT_MESA, 1.0, 0.0), 10, 10)
uniform.float.coldAir = smooth(if(temperature < 0.3, 1.0, 0.0), 10, 10)
uniform.vec3.biomeFogTint = vec3(1.0 - swampAir * 0.15 + desertAir * 0.1 - coldAir * 0.1, 1.0 + swampAir * 0.02 - desertAir * 0.02 - coldAir * 0.03, 1.0 - swampAir * 0.22 - desertAir * 0.2 + coldAir * 0.1)
#NoName: sunrise animation: rises from 22200 (just before dawn) to full at 23000, then fades out until 2000. not in rain
uniform.float.sunrise = if(worldTime > 12000, clamp((worldTime - 22200.0) / 800.0, 0.0, 1.0), clamp(1.0 - worldTime / 2000.0, 0.0, 1.0)) * (1.0 - rainStrength)
#NoName: fireflies. at night, without rain, in green biomes, and not while you are underground

variable.float.invSunMagnitude = 1.0 / sqrt(sunPosition.x * sunPosition.x + sunPosition.y * sunPosition.y + sunPosition.z * sunPosition.z)
uniform.vec3.sunPosNorm = vec3(sunPosition.x * invSunMagnitude, sunPosition.y * invSunMagnitude, sunPosition.z * invSunMagnitude)
#NoName: how much you are looking towards the moon (0 = away, 1 = at it). the camera looks along -z in view space and the moon is -sunPosNorm,
#so this is sunPosNorm.z. smooth() makes the moonlight path fade in over ~1 s and out over ~0.6 s.
uniform.float.moonLook = smooth(clamp((sunPosition.z * invSunMagnitude - 0.4) / 0.45, 0.0, 1.0), 1.0, 0.6)
#NoName: animation clock driven by game ticks instead of real time, so water, wind, clouds etc.
#follow /tick freeze, /tick rate and /tick step. worldTime only changes 20 times per second, so smooth()
#glides between ticks to keep it fluid. wraps every 180 in-game days to keep float precision.
variable.float.tickSeconds = (worldDay % 180) * 1200.0 + worldTime / 20.0
uniform.float.animTime = smooth(tickSeconds, 0.05, 0.05)
#NoName: water keeps real time (it should not stop with /tick freeze)
uniform.float.realTime = frameTimeCounter
#NoName: the end sky (nebulae, void clouds, stars, lightning) runs at 15% speed, calmer (only the void clouds use it now)
uniform.float.endSkyTime = frameTimeCounter * 0.15

variable.float.invUpMagnitude = 1.0 / sqrt(upPosition.x * upPosition.x + upPosition.y * upPosition.y + upPosition.z * upPosition.z)
uniform.vec3.upPosNorm = vec3(upPosition.x * invUpMagnitude, upPosition.y * invUpMagnitude, upPosition.z * invUpMagnitude)